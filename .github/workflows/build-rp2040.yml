name: build-rp2040
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      runner:
        description: runs-on value as JSON
        type: string
        default: '"ubuntu-22.04"'
      max_wait:
        description: skip (successfully) if the job starts more than this many seconds after the run started
        type: number
        default: 0
defaults:
  run:
    shell: bash --noprofile --norc -x -e -o pipefail {0}
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # ccache for CMake; the build steps stay as upstream's
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # A self-hosted job that starts late (runner was offline, the GitHub fallback built it) or for a
      # commit that is no longer the branch head does nothing.
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ inputs.max_wait }}" -gt 0 ]; then
            started=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | jq -r .run_started_at)
            age=$(( $(date +%s) - $(date -d "$started" +%s) ))
            [ "$age" -le "${{ inputs.max_wait }}" ] || { echo "started ${age}s after the run: the fallback build covers it"; go=false; }
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        if: steps.gate.outputs.go == 'true'
        with:
          submodules: true
          # sync-upstream.yml passes the branch it just merged into
          ref: ${{ inputs.ref }}
      - uses: actions/cache@v4
        if: steps.gate.outputs.go == 'true' && runner.environment == 'github-hosted'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - name: Install compiler, libraries and tools
        if: steps.gate.outputs.go == 'true' && runner.environment == 'github-hosted'
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib srecord ccache
      - name: Build
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir build
          cd build
          cmake ..
          make
          cd ..
          mkdir build-boards
          cd build-boards
          PICO_BOARD=remapper cmake ..
          make remapper_dual_combined
          cd ..
          mkdir build-board_v7
          cd build-board_v7
          PICO_BOARD=remapper_v7 cmake ..
          make remapper_dual_combined
          cd ..
          mkdir build-board_v8
          cd build-board_v8
          PICO_BOARD=remapper_v8 cmake ..
          make remapper
          cd ..
          mkdir build-feather
          cd build-feather
          PICO_BOARD=feather_host cmake ..
          make remapper
          cd ..
          mkdir build-waveshare_rp2040_pizero
          cd build-waveshare_rp2040_pizero
          PICO_BOARD=waveshare_rp2040_pizero cmake ..
          make remapper
          cd ..
          mkdir build-pico2
          cd build-pico2
          PICO_BOARD=pico2 cmake ..
          make remapper remapper_dual_a remapper_dual_b remapper_dual_combined
          cd ..
          mkdir build-waveshare_rp2350_usb_a
          cd build-waveshare_rp2350_usb_a
          PICO_BOARD=waveshare_rp2350_usb_a cmake ..
          make remapper
          cd ..
          mkdir build-flatbox_rev4
          cd build-flatbox_rev4
          PICO_BOARD=flatbox_rev4 cmake ..
          make remapper
          cd ..
          mkdir build-flatbox_rev8
          cd build-flatbox_rev8
          PICO_BOARD=flatbox_rev8 cmake ..
          make remapper
          cd ..
          mkdir build-waveshare_rp2350_pizero
          cd build-waveshare_rp2350_pizero
          PICO_BOARD=waveshare_rp2350_pizero cmake ..
          make remapper
          cd ..
          mkdir build-meisterconverter
          cd build-meisterconverter
          PICO_BOARD=meisterconverter cmake ..
          make remapper
          cd ..
          mkdir build-rp2040abb
          cd build-rp2040abb
          PICO_BOARD=rp2040abb cmake ..
          make remapper
          cd ..
          mkdir artifacts
          mv build/*.uf2 artifacts
          rm artifacts/flash_b_side.uf2
          mv build-boards/remapper_dual_combined.uf2 artifacts/remapper_board.uf2
          mv build-board_v7/remapper_dual_combined.uf2 artifacts/remapper_board_v7.uf2
          mv build-board_v8/remapper.uf2 artifacts/remapper_board_v8.uf2
          mv build-feather/remapper.uf2 artifacts/remapper_feather.uf2
          mv build-waveshare_rp2040_pizero/remapper.uf2 artifacts/remapper_waveshare_rp2040_pizero.uf2
          mv build-pico2/remapper.uf2 artifacts/remapper_pico2.uf2
          mv build-pico2/remapper_dual_a.uf2 artifacts/remapper_pico2_dual_a.uf2
          mv build-pico2/remapper_dual_b.uf2 artifacts/remapper_pico2_dual_b.uf2
          mv build-pico2/remapper_dual_combined.uf2 artifacts/remapper_pico2_dual_combined.uf2
          mv build-waveshare_rp2350_usb_a/remapper.uf2 artifacts/remapper_waveshare_rp2350_usb_a.uf2
          mv build-flatbox_rev4/remapper.uf2 artifacts/remapper_flatbox_rev4.uf2
          mv build-flatbox_rev8/remapper.uf2 artifacts/remapper_flatbox_rev8.uf2
          mv build-waveshare_rp2350_pizero/remapper.uf2 artifacts/remapper_waveshare_rp2350_pizero.uf2
          mv build-meisterconverter/remapper.uf2 artifacts/remapper_meisterconverter.uf2
          mv build-rp2040abb/remapper.uf2 artifacts/remapper_rp2040abb.uf2
        working-directory: ./firmware
      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.go == 'true'
        with:
          path: firmware/artifacts/*
      - name: Upload firmware to the latest release
        if: steps.gate.outputs.go == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest firmware
          files: |
            firmware/artifacts/*
