name: build
# Builds on the owner's self-hosted WSL runner (label wsl-build) only. If the runner is
# offline, the job waits in the queue until it is back; nothing runs on GitHub's runners.
# The runner itself refuses any job that isn't a push, manual run or schedule by the owner
# on this repository (job-start hook set up by the owner's wsl-setup.sh), so pull requests
# and forks can never run on it. This workflow has no pull_request trigger.
#
# The GitHub-hosted fallback (watch + github jobs below) is commented out: GitHub disabled
# Actions on this repo for wasted compute (2026-11), mostly the watch job polling on a
# GitHub runner during every build. Don't re-enable it without a cheaper design.
on:
  push:
    branches:
      - master
    paths:
      - 'firmware/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local:
    uses: ./.github/workflows/build-rp2040.yml
    with:
      runner: '["self-hosted", "wsl-build"]'
